<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Built by Utsav — Coming soon</title>
<meta name="description" content="A studio for websites, web apps and software — designed and coded in public.">
<meta name="theme-color" content="#2B3BFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#2B3BFF; --blue-top:#3445FF; --blue-deep:#1A26B8;
    --ink:#0C0C0C; --paper:#FFFFFF; --suggest:#8E97FF; --muted:#C9CDFF;
    --pad:clamp(22px,4vw,56px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'General Sans',system-ui,sans-serif;color:var(--paper);
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 70% 50% at 50% 38%,rgba(90,104,255,.55) 0%,rgba(90,104,255,0) 70%),
      linear-gradient(180deg,var(--blue-top) 0%,var(--blue) 45%,var(--blue-deep) 100%);
    background-attachment:fixed;
  }
  a{color:var(--paper)} a:hover{color:var(--muted)}

  .page{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding:var(--pad)}
  .grain{position:fixed;inset:0;pointer-events:none;opacity:.6;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");background-size:180px 180px}
  .soon{position:absolute;left:0;right:0;bottom:-0.08em;text-align:center;pointer-events:none;user-select:none;
    font:italic 400 clamp(230px,43vw,620px)/.8 'Instrument Serif',serif;letter-spacing:-0.04em;color:rgba(255,255,255,.07);white-space:nowrap}

  .top,.hero,.bottom{position:relative}
  .top{display:flex;justify-content:space-between;align-items:center;gap:16px;
    font:500 clamp(10px,1vw,12px)/1 'JetBrains Mono',monospace;letter-spacing:.08em}
  .top .status{display:flex;align-items:center;gap:8px}
  .top .status::before{content:"";width:8px;height:8px;background:var(--paper)}

  .hero{display:flex;flex-direction:column;align-items:center;gap:clamp(16px,2vw,22px);text-align:center}
  .hero p{margin:0;max-width:520px;font:500 clamp(15px,1.3vw,17px)/1.5 'General Sans',sans-serif;text-wrap:balance}

  /* Logo — Built(by) / [Ut sav |]  (blue colourway) */
  .logo{display:inline-flex;flex-direction:column;align-items:flex-start;font:700 clamp(70px,9vw,130px)/.78 'General Sans',sans-serif;letter-spacing:-0.06em;text-align:left}
  .logo .by{font:italic 400 1.03em/.78 'Instrument Serif',serif;letter-spacing:-0.02em;color:var(--ink)}
  .logo .plate{display:flex;align-items:center;background:var(--ink);padding:.16em .16em .22em .1em;margin-top:.1em}
  .logo .sav{color:#ffffff50}
  .logo .caret{width:.08em;height:.78em;background:var(--paper);margin:.1em 0 0 .08em;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){.logo .caret{animation:none}}

  .bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:18px}
  .log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font:500 12px/1.3 'JetBrains Mono',monospace}
  .log li{display:flex;align-items:center;gap:10px}
  .log .todo{color:var(--muted)}
  .log .cur::after{content:"";width:7px;height:14px;background:var(--paper)}

  form{display:flex;align-items:center;background:var(--paper);padding:5px 5px 5px 16px;width:400px;max-width:100%}
  form input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:500 15px 'General Sans',sans-serif;color:var(--ink)}
  form input::placeholder{color:#8A8A85}
  form button{border:0;cursor:pointer;background:var(--ink);color:var(--paper);font:600 15px 'General Sans',sans-serif;padding:12px 18px;white-space:nowrap}
  form button:hover{background:#2A2A2A}
  form button:focus-visible,form input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .thanks{font:500 14px 'General Sans',sans-serif}

  @media (max-width:640px){
    .bottom{flex-direction:column;align-items:stretch}
    form{width:auto}
  }
</style>
</head>
<body>
<div class="grain" aria-hidden="true"></div>
<main class="page">
  <div class="soon" aria-hidden="true">soon</div>

  <header class="top">
    <span>BUILTBYUTSAV.COM</span>
    <span class="status">COMING SOON</span>
  </header>

  <section class="hero">
    <h1 class="logo" aria-label="Built by Utsav" style="margin:0">
      <span>Built<span class="by">by</span></span>
      <span class="plate"><span>Ut</span><span class="sav">sav</span><span class="caret"></span></span>
    </h1>
    <p>A studio for websites, web apps and software — designed and coded in public. The site ships soon.</p>
  </section>

  <footer class="bottom">
    <ul class="log" aria-label="Build progress">
      <li><span>✓</span>brand identity — shipped</li>
      <li class="cur"><span>◐</span>website — in progress</li>
      <li class="todo"><span>○</span>launch</li>
    </ul>
    <form id="notify" action="https://formsubmit.co/builtbyutsav@gmail.com" method="POST" novalidate>
      <input type="hidden" name="_subject" value="New BuiltByUtsav launch signup">
      <input type="hidden" name="_template" value="table">
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
      <input type="email" name="email" placeholder="your@email.com" aria-label="Email address" required>
      <button type="submit">Notify me →</button>
    </form>
  </footer>
</main>
<script>
  // Signups are emailed to builtbyutsav@gmail.com via FormSubmit
  document.getElementById('notify').addEventListener('submit', function (e) {
    e.preventDefault();
    var form = this, input = form.email, btn = form.querySelector('button');
    if (!input.value || !input.checkValidity()) { input.focus(); input.reportValidity(); return; }
    btn.disabled = true; btn.textContent = 'Sending…';
    fetch('https://formsubmit.co/ajax/builtbyutsav@gmail.com', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        email: input.value,
        _subject: 'New BuiltByUtsav launch signup',
        _template: 'table',
        _honey: form._honey.value
      })
    })
    .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function () {
      form.outerHTML = '<p class="thanks">You’re on the list — launch link coming your way.</p>';
    })
    .catch(function () {
      btn.disabled = false; btn.textContent = 'Notify me →';
      alert('Something went wrong. Please try again or email builtbyutsav@gmail.com.');
    });
  });
</script>
</body>
</html>
